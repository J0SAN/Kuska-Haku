asyncapi: 3.0.0
info:
  title: Kuska Haku — Contrato de Posición GPS
  version: 0.3.0-mvp
  description: >
    Define el formato exacto del mensaje de posición GPS que viaja por el
    sistema: (1) del simulador o rastreadores de hardware al backend vía MQTT,
    y (2) del backend a la app del Pasajero vía WebSocket tras pasar por el
    caso de uso unificado PositionIngestor.

servers:
  mqttBroker:
    host: localhost:1883
    protocol: mqtt
    description: Broker Mosquitto local restringido a 127.0.0.1 (Fase 5).

channels:
  busPosition:
    address: "gps/positions"
    description: >
      Topic MQTT donde el simulador o unidades IoT publican su posición GPS en
      tiempo real cada 3-5 segundos. El backend también escucha el patrón
      kuska/+/bus/+/position.
    messages:
      gpsPosition:
        $ref: "#/components/messages/GpsPosition"

operations:
  publishPosition:
    action: send
    channel:
      $ref: "#/channels/busPosition"
    summary: El simulador publica su posición cada 3-5 segundos.
  receivePosition:
    action: receive
    channel:
      $ref: "#/channels/busPosition"
    summary: >
      El backend consume el mensaje MQTT, lo procesa a través de
      PositionIngestor (historial en PostgreSQL + última posición en Redis con
      TTL de 2 min) y lo difunde por canal de ruta a los pasajeros suscritos
      vía WebSocket.

components:
  messages:
    GpsPosition:
      name: GpsPosition
      title: Posición GPS de un bus
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GpsPositionPayload"

  schemas:
    GpsPositionPayload:
      type: object
      required:
        - bus_id
        - route_id
        - latitude
        - longitude
        - timestamp
      properties:
        bus_id:
          type: string
          description: Identificador único del bus/unidad, ej. "bus-01"
        route_id:
          type: string
          description: Identificador o código de la ruta, ej. "ruta-01"
        latitude:
          type: number
          format: double
          description: Latitud en grados decimales (WGS84)
          example: -7.1611
        longitude:
          type: number
          format: double
          description: Longitud en grados decimales (WGS84)
          example: -78.5127
        speed_kmh:
          type: number
          format: float
          description: Velocidad instantánea en km/h, utilizada para el cálculo de ETA
          example: 25.0
        heading:
          type: number
          format: float
          description: Rumbo/orientación en grados (0-360, 0 = norte)
          example: 90.0
        timestamp:
          type: string
          format: date-time
          description: Momento de captura del punto GPS en el dispositivo (ISO 8601, UTC)

# ---------------------------------------------------------------------------
# Fase 4 — Reglas del lado WebSocket (backend -> pasajero)
#
#  1. El gateway ws://HOST/ws/routes/{routeId}?token=<JWT> EXIGE un token
#     válido. Sin token o con uno inválido responde 401 antes del upgrade.
#
#  2. Convención de identificadores: en este contrato, bus_id es el código
#     físico/operativo del bus (fleet.bus_id, ej. "bus-01"). El backend usa
#     fleet.bus_id para ubicar la última posición en Redis al calcular el ETA,
#     así que el código de bus registrado en el panel administrativo debe
#     coincidir exactamente con el bus_id que publica el conductor o simulador.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Fase 5 — Quién publica por MQTT y quién lo hace por HTTP
#
#  El CELULAR del conductor NO publica por MQTT. Envía sus puntos por HTTP
#  autenticado a POST /api/v1/driver/positions (ver client-api.openapi.yaml).
#  Motivo: el broker de desarrollo acepta conexiones locales sin credenciales
#  por dispositivo, y exponerlo a internet permitiría falsificar posiciones en
#  nombre de cualquier bus. Por HTTP, el backend deduce el bus directamente del
#  JWT del conductor autenticado.
#
#  Este canal MQTT queda como entrada INTERNA para cmd/simulator y futuros
#  rastreadores GPS dedicados. Ambos caminos desembocan en el mismo caso de
#  uso (PositionIngestor): mismas validaciones, mismo historial en
#  kuska.gps_positions y misma difusión en vivo hacia Redis/WebSocket.
# ---------------------------------------------------------------------------
